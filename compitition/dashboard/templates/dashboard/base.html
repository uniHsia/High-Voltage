{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - 高电压设备智能健康管理一体化平台</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="{% url 'home' %}" class="nav-item {% if '/home/' in request.path %}active{% endif %}">首页</a>
                <a href="{% url 'diagnosis' %}" class="nav-item {% if '/diagnosis/' in request.path %}active{% endif %}">智能诊断</a>
                <a href="{% url 'health' %}" class="nav-item {% if '/health/' in request.path %}active{% endif %}">健康评估</a>
                <a href="{% url 'history' %}" class="nav-item {% if '/history/' in request.path %}active{% endif %}">历史追溯</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="platform-title">高电压设备智能健康管理一体化平台</div>
                <div class="user-info">
                    用户：{{ request.session.username|default:"admin" }}
                    <a href="{% url 'logout' %}" class="logout-btn">退出登录</a>
                </div>
            </header>

            {% if messages %}
            <div class="message-wrapper">
                {% for message in messages %}
                <div class="message-item {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <section class="content-area">
                {% block content %}{% endblock %}
            </section>
        </main>
    </div>

    <script src="{% static 'js/charts.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
