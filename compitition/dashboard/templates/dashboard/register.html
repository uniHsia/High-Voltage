{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 高电压设备智能健康管理一体化平台</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">用户注册</h1>
            <p class="auth-subtitle">请填写信息完成账户创建</p>

            {% if messages %}
            <div class="message-wrapper">
                {% for message in messages %}
                <div class="message-item {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post" class="auth-form">
                {% csrf_token %}

                <div class="auth-form-group">
                    <label>用户名</label>
                    <input type="text" name="username" placeholder="请输入用户名" value="{{ saved_username }}">
                </div>

                <div class="auth-form-group">
                    <label>邮箱</label>
                    <input type="email" name="email" placeholder="请输入邮箱" value="{{ saved_email }}">
                </div>

                <div class="auth-form-group">
                    <label>密码</label>
                    <input type="password" name="password" placeholder="请输入密码">
                </div>

                <div class="auth-form-group">
                    <label>确认密码</label>
                    <input type="password" name="confirm_password" placeholder="请再次输入密码">
                </div>

                <button type="submit" class="primary-btn auth-btn">注册</button>
            </form>

            <div class="auth-footer">
                已有账号？
                <a href="{% url 'login' %}">返回登录</a>
            </div>
        </div>
    </div>
</body>
</html>
