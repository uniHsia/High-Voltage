{% extends 'dashboard/base.html' %}

{% block content %}
<div class="card" style="padding: 30px;">
    <h2 style="color: #183d65; margin-bottom: 20px;">🔧 系统调试页面</h2>

    <div style="background: #f0f8ff; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
        <h3 style="color: #21486e;">📋 系统状态检查</h3>
        <div id="system-status" style="font-family: monospace; font-size: 14px; line-height: 1.8;">
            正在检���系统状态...
        </div>
    </div>

    <div style="background: #fff8e8; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
        <h3 style="color: #21486e;">🧪 功能测试</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button onclick="testECharts()" class="primary-btn">测试ECharts</button>
            <button onclick="testAPI()" class="primary-btn">测试API连接</button>
            <button onclick="renderAllCharts()" class="primary-btn">渲染所有图表</button>
        </div>
        <div id="test-results" style="margin-top: 15px; padding: 15px; background: white; border-radius: 8px; min-height: 100px;">
            <em style="color: #666;">点击按钮查看测试结果...</em>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="card" style="padding: 20px;">
            <h3 style="color: #21486e;">📊 测试图表1 - 折线图</h3>
            <div id="testChart1" style="width: 100%; height: 250px; background: #f9f9f9; border: 1px dashed #ccc;"></div>
        </div>
        <div class="card" style="padding: 20px;">
            <h3 style="color: #21486e;">📈 测试图表2 - 饼图</h3>
            <div id="testChart2" style="width: 100%; height: 250px; background: #f9f9f9; border: 1px dashed #ccc;"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function updateStatus(message, isSuccess) {
    var statusDiv = document.getElementById('system-status');
    var color = isSuccess ? 'green' : 'red';
    var symbol = isSuccess ? '✓' : '✗';
    statusDiv.innerHTML += '<div style="color: ' + color + ';">' + symbol + ' ' + message + '</div>';
}

function addTestResult(message) {
    var resultsDiv = document.getElementById('test-results');
    resultsDiv.innerHTML += '<div style="margin-bottom: 8px;">' + message + '</div>';
}

function checkSystemStatus() {
    var statusDiv = document.getElementById('system-status');
    statusDiv.innerHTML = '';

    // 检查ECharts
    if (typeof echarts !== 'undefined') {
        updateStatus('ECharts库: 已加载 (版本 ' + echarts.version + ')', true);
    } else {
        updateStatus('ECharts库: 未加载 ❌', false);
    }

    // 检查charts.js函数
    var chartsFunctions = [
        'renderPRPDInputChart',
        'renderProbabilityChart',
        'renderGaugeChart',
        'renderFusionTrendChart'
    ];

    var allFunctionsAvailable = true;
    chartsFunctions.forEach(function(func) {
        var available = typeof window[func] !== 'undefined';
        if (available) {
            updateStatus('函数 ' + func + ': 已定义 ✓', true);
        } else {
            updateStatus('函数 ' + func + ': 未定义 ❌', false);
            allFunctionsAvailable = false;
        }
    });

    // 检查主要按钮
    var mainButtons = ['runDiagnosisBtn', 'runHealthBtn'];
    mainButtons.forEach(function(btnId) {
        var button = document.getElementById(btnId);
        updateStatus('按钮 ' + btnId + ': ' + (button ? '存在 ✓' : '不存在 ❌'), button !== null);
    });

    updateStatus('整体状态: ' + (allFunctionsAvailable ? '正常 ✓' : '异常 ❌'), allFunctionsAvailable);
}

function testECharts() {
    addTestResult('<strong>测试ECharts库...</strong>');

    try {
        if (typeof echarts === 'undefined') {
            addTestResult('<span style="color: red;">✗ ECharts库未加载，请检查网络连接</span>');
            return;
        }

        addTestResult('<span style="color: green;">✓ ECharts库已加载</span>');
        addTestResult('ECharts版本: ' + echarts.version);

        // 创建测试图表
        var chartDom = document.getElementById('testChart1');
        if (!chartDom) {
            addTestResult('<span style="color: red;">✗ 图表容器不存在</span>');
            return;
        }

        var myChart = echarts.init(chartDom);
        var option = {
            title: { text: 'ECharts测试图表' },
            xAxis: { type: 'category', data: ['A', 'B', 'C'] },
            yAxis: { type: 'value' },
            series: [{ type: 'bar', data: [10, 20, 30] }]
        };
        myChart.setOption(option);
        addTestResult('<span style="color: green;">✓ ECharts测试图表渲染成功</span>');

    } catch (error) {
        addTestResult('<span style="color: red;">✗ ECharts测试失败: ' + error.message + '</span>');
    }
}

function testAPI() {
    addTestResult('<strong>测试API连接...</strong>');

    fetch('/api/test-import/', {
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(function(response) {
        if (response.ok) {
            return response.json();
        } else {
            throw new Error('HTTP ' + response.status);
        }
    })
    .then(function(data) {
        if (data.success) {
            addTestResult('<span style="color: green;">✓ API连接正常</span>');
            addTestResult('API返回: ' + data.message);
        } else {
            addTestResult('<span style="color: red;">✗ API返回错误: ' + data.error + '</span>');
        }
    })
    .catch(function(error) {
        addTestResult('<span style="color: red;">✗ API连接失败: ' + error.message + '</span>');
    });
}

function renderAllCharts() {
    addTestResult('<strong>尝试渲染所有测试图表...</strong>');

    try {
        // 渲染测试图表1
        var chart1 = echarts.init(document.getElementById('testChart1'));
        chart1.setOption({
            title: { text: '测试图表1 - 折线图' },
            xAxis: { type: 'category', data: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'] },
            yAxis: { type: 'value' },
            series: [{ type: 'line', data: [150, 230, 224, 218, 135], smooth: true }]
        });

        // 渲染测试图表2
        var chart2 = echarts.init(document.getElementById('testChart2'));
        chart2.setOption({
            title: { text: '测试图表2 - 饼图' },
            series: [{
                type: 'pie',
                data: [
                    { value: 335, name: 'A' },
                    { value: 310, name: 'B' },
                    { value: 234, name: 'C' },
                    { value: 135, name: 'D' },
                    { value: 1548, name: 'E' }
                ]
            }]
        });

        addTestResult('<span style="color: green;">✓ 所有测试图表渲染成功</span>');

    } catch (error) {
        addTestResult('<span style="color: red;">✗ 图表渲染失败: ' + error.message + '</span>');
    }
}

// 页面加载时自动检查系统状态
document.addEventListener('DOMContentLoaded', function() {
    console.log('调试页面加载完成');
    setTimeout(checkSystemStatus, 500);  // 延迟500ms确保所有脚本加载完成
});
</script>
{% endblock %}
