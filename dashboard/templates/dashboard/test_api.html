<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>API测试页面</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .btn { padding: 10px 20px; margin: 10px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 5px; }
        .btn:hover { background: #0056b3; }
        #result { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 5px; }
        .loading { color: #ff6b6a; font-weight: bold; }
        .success { color: #28a745; font-weight: bold; }
        .error { color: #dc3545; font-weight: bold; }
        .info { color: #17a2b8; }
        .status-box { margin-top: 10px; padding: 10px; background: #fff3cd; border-radius: 5px; border-left: 4px solid #ffc107; }
    </style>
</head>
<body>
    <h1>高电压设备智能健康管理平台 - API测试</h1>

    <div>
        <h2>测试1: 检查模型导入</h2>
        <button class="btn" onclick="testImport()">测试模型导入</button>
    </div>

    <div>
        <h2>测试2: 智能诊断API</h2>
        <p class="info">基于交叉注意力的局部放电诊断模型</p>
        <button class="btn" onclick="testDiagnosis()">运行诊断模型</button>
    </div>

    <div>
        <h2>测试3: 健康评估API</h2>
        <p class="info">基于改进交叉注意力的HI评估与RUL预测模型</p>
        <p style="color: #ff6b6a; font-size: 12px;">注意：首次运行需要训练模型（约1-2分钟），后续运行会很快！</p>
        <button class="btn" onclick="testHealth()">运行健康评估模型</button>
        <div id="healthStatus" style="display: none;">
            <div class="status-box">
                <p id="healthProgress" style="margin: 0; color: #856404;"></p>
            </div>
        </div>
    </div>

    <div id="result">
        <p>点击按钮开始测试...</p>
    </div>

    <script>
        function testImport() {
            document.getElementById('result').innerHTML = '<p class="loading">正在测试...</p>';
            fetch('/api/test-import/')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('result').innerHTML =
                            '<p class="success">✓ 模型导入成功</p><p>' + data.message + '</p>';
                    } else {
                        document.getElementById('result').innerHTML =
                            '<p class="error">✗ 导入失败</p><p>' + data.error + '</p>';
                    }
                })
                .catch(error => {
                    document.getElementById('result').innerHTML =
                        '<p class="error">✗ 请求失败</p><p>' + error.message + '</p>';
                });
        }

        function testDiagnosis() {
            document.getElementById('result').innerHTML =
                '<p class="loading">正在运行诊断模型（约10-30秒）...</p>';

            fetch('/api/run-diagnosis/')
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById('result').innerHTML =
                            '<p class="error">✗ 模型运行失败</p><p>' + data.error + '</p>';
                    } else {
                        const html = '<p class="success">✓ 诊断模型运行成功！</p>' +
                            '<h3>诊断结果：</h3>' +
                            '<p>放电类型：<strong>' + data.discharge_type + '</strong></p>' +
                            '<p>置信度：<strong>' + data.confidence + '%</strong></p>' +
                            '<p>严重程度：<strong>' + data.severity + '</strong></p>' +
                            '<h3>返回数据字段：</h3>' +
                            '<p>' + Object.keys(data).join(', ') + '</p>';
                        document.getElementById('result').innerHTML = html;
                    }
                })
                .catch(error => {
                    document.getElementById('result').innerHTML =
                        '<p class="error">✗ 请求失败</p><p>' + error.message + '</p>';
                });
        }

        function testHealth() {
            const statusDiv = document.getElementById('healthStatus');
            const progressP = document.getElementById('healthProgress');
            statusDiv.style.display = 'block';
            progressP.textContent = '首次运行需要训练模型，请耐心等待（约1-2分钟）...';

            document.getElementById('result').innerHTML =
                '<p class="loading">正在运行健康评估模型...</p>';

            // 设置更长的超时时间（3分钟）
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 180000);

            fetch('/api/run-health/', { signal: controller.signal })
                .then(response => response.json())
                .then(data => {
                    clearTimeout(timeout);
                    statusDiv.style.display = 'none';

                    if (data.error) {
                        document.getElementById('result').innerHTML =
                            '<p class="error">✗ 模型运行失败</p><p>' + data.error.substring(0, 500) + '</p>';
                    } else {
                        const html = '<p class="success">✓ 健康评估模型运行成功！</p>' +
                            '<h3>健康评估结果：</h3>' +
                            '<p>设备：<strong>' + data.device_name + '</strong></p>' +
                            '<p>HI指数：<strong>' + data.hi_score + '</strong></p>' +
                            '<p>状态：<strong>' + data.status + '</strong></p>' +
                            '<p>RUL预测：<strong>' + data.rul_days + '天 (' + data.rul_months + '个月)</strong></p>' +
                            '<h3>返回数据字段：</h3>' +
                            '<p>' + Object.keys(data).join(', ') + '</p>';
                        document.getElementById('result').innerHTML = html;
                    }
                })
                .catch(error => {
                    clearTimeout(timeout);
                    statusDiv.style.display = 'none';
                    if (error.name === 'AbortError') {
                        document.getElementById('result').innerHTML =
                            '<p class="error">✗ 请求超时（超过3分钟）</p><p>首次运行需要训练模型，请刷新页面重试。如果已经训练过，请检查服务器日志。</p>';
                    } else {
                        document.getElementById('result').innerHTML =
                            '<p class="error">✗ 请求失败</p><p>' + error.message + '</p>';
                    }
                });
        }

        console.log('测试页面已加载');
        console.log('ECharts版本:', echarts.version);
    </script>
</body>
</html>
